# Iggy -> Flink -> TimescaleDB (see docs/architecture.md).
#
#   docker compose up --build            # iggy, setups, Flink JM + 2 TMs (PIPELINE=ema), replay producer
#   docker compose logs -f taskmanager   # per-node counters
#   docker compose run --rm replay-producer   # replay the CSV again
#
# Flink UI: http://localhost:8081   Grafana: http://localhost:3001 (admin/admin; anonymous viewers allowed)
# Prometheus: http://localhost:9090

x-iggy-env: &iggy-env
  IGGY_USERNAME: iggy
  IGGY_PASSWORD: iggy
  IGGY_STREAM: trading
  IGGY_TOPIC: ${IGGY_TOPIC:-ticks}
  IGGY_ADVISORIES_TOPIC: advisories     # output: BUY/SELL advisories from the Flink job
  IGGY_CONSUMER_GROUP: ${IGGY_CONSUMER_GROUP:-flink}

x-flink-env: &flink-env
  <<: *iggy-env
  IGGY_ADDRESS: iggy:8090
  IGGY_POLL_BATCH: ${IGGY_POLL_BATCH:-100}
  PIPELINE: ${PIPELINE:-ema}           # ema (EMA + advisories) | full (connector test) | count (source only) | jdbc
  REPORT_INTERVAL_MS: ${REPORT_INTERVAL_MS:-5000}
  # PIPELINE=jdbc (TimescaleDB sink test)
  JDBC_URL: jdbc:postgresql://timescaledb:5432/trading
  JDBC_USER: postgres
  JDBC_PASSWORD: postgres
  OUT_OF_ORDERNESS_S: ${OUT_OF_ORDERNESS_S:-60}
  IDLENESS_S: ${IDLENESS_S:-10}       # 0 = no idleness
  # PIPELINE=ema data-quality report thresholds
  SKEW_REPORT_S: ${SKEW_REPORT_S:-3600}             # Trading time vs system Time
  PRICE_JUMP_REPORT: ${PRICE_JUMP_REPORT:-0.10}     # close vs previous close of the symbol
  # Advisories per Iggy send. 1 = each advisory is sent as soon as it is computed; with larger batches the
  # connector holds a partial batch until the next checkpoint (up to CHECKPOINT_INTERVAL).
  IGGY_ADVISORY_BATCH: ${IGGY_ADVISORY_BATCH:-1}
  # Per-trader advisory subscriptions (FR-4), read by the job at start (JobManager). Format: config/subscriptions.txt
  SUBSCRIPTIONS_FILE: ${SUBSCRIPTIONS_FILE:-/config/subscriptions.txt}
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: jobmanager
    taskmanager.numberOfTaskSlots: 1
    parallelism.default: 2
    # Heap (HashMap) state backend: keyed state lives as Java objects on the TaskManager heap. State is
    # small (per symbol: EMAs plus the open window), so RocksDB's disk spill and serialization are not needed.
    state.backend.type: hashmap
    execution.checkpointing.interval: ${CHECKPOINT_INTERVAL:-10 s}
    # File-system checkpoints on a volume shared by JobManager and TaskManagers. The default in-memory
    # (JobManager) storage is capped at 5 MB, which growing window state exceeded (MEASUREMENTS.md).
    execution.checkpointing.storage: filesystem
    execution.checkpointing.dir: file:///flink-checkpoints
    restart-strategy.type: fixed-delay
    restart-strategy.fixed-delay.attempts: 10
    restart-strategy.fixed-delay.delay: 5 s
    # Prometheus endpoint on every JobManager / TaskManager (scraped by `prometheus`, shown in Grafana)
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: 9249

services:
  iggy:
    image: apache/iggy:0.10.0
    cap_add: [SYS_NICE]
    security_opt: [seccomp:unconfined]
    ulimits:
      memlock: { soft: -1, hard: -1 }
    environment:
      SERVICE: iggy   # container label for cAdvisor (see the cadvisor service)
      IGGY_ROOT_USERNAME: iggy
      IGGY_ROOT_PASSWORD: iggy
      IGGY_NODE_ADVERTISED_ADDRESS: iggy
      # 0.10 defaults to loopback binds, which are unreachable from other containers
      IGGY_TCP_ADDRESS: 0.0.0.0:8090
      IGGY_HTTP_ADDRESS: 0.0.0.0:3000
      IGGY_QUIC_ENABLED: "false"
      IGGY_WEBSOCKET_ENABLED: "false"
      # default NUMA-aware allocation fails inside a container ("only 0 available")
      IGGY_SHARDING_CPU_ALLOCATION: ${IGGY_SHARDS:-2}
      IGGY_SHARDING_PIN_CORES: "false"
    ports:
      - "8090:8090"   # TCP
      - "3000:3000"   # HTTP API
    volumes:
      - iggy-data:/local_data

  timescaledb:
    image: timescale/timescaledb:2.31.0-pg17
    shm_size: 512mb   # Docker's 64 MB /dev/shm is too small for parallel queries ("could not resize shared memory segment")
    environment:
      SERVICE: timescaledb
      POSTGRES_DB: trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./config/timescaledb:/docker-entrypoint-initdb.d:ro   # fresh volume (also for --no-deps bench runs)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading"]
      interval: 2s
      retries: 30

  # One-shot: applies the idempotent schema, so new tables also reach an existing database volume.
  db-setup:
    image: timescale/timescaledb:2.31.0-pg17
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-h", "timescaledb", "-U", "postgres", "-d", "trading",
              "-f", "/init/init.sql"]
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./config/timescaledb:/init:ro
    depends_on:
      timescaledb: { condition: service_healthy }

  # Creates stream, input topic `ticks` + consumer group (the Flink connector expects the group to exist)
  # and output topic `advisories`.
  iggy-setup:
    build: ./producer-rs
    image: scalable/producer-rs
    command: ["setup"]
    environment:
      <<: *iggy-env
      IGGY_HOST: iggy
      # 1 partition: the Iggy Flink connector has one watermark per reader, not per partition; with more
      # partitions about half the events arrive late (MEASUREMENTS.md). Only one reader is active anyway.
      IGGY_PARTITIONS: ${IGGY_PARTITIONS:-1}
      # 1 partition: the connector's sink picks one partition per batch (round-robin, or from the batch's first
      # message), so with more partitions a symbol's advisories could be spread and read out of order.
      # Advisories are few (~11k per week).
      IGGY_ADVISORIES_PARTITIONS: ${IGGY_ADVISORIES_PARTITIONS:-1}
    depends_on: [iggy]

  jobmanager:
    build: ./flink-job
    image: scalable/flink-job
    command: standalone-job --job-classname scalable.flink.ConnectorTestJob
    ports:
      - "8081:8081"
    environment:
      <<: *flink-env
      SERVICE: jobmanager
    volumes:
      - flink-checkpoints:/flink-checkpoints
      - ./config:/config:ro    # subscriptions.txt
    depends_on:
      iggy-setup: { condition: service_completed_successfully }
      db-setup: { condition: service_completed_successfully }

  taskmanager:
    image: scalable/flink-job
    command: taskmanager
    deploy:
      replicas: 2
    environment:
      <<: *flink-env
      SERVICE: taskmanager
    volumes:
      - flink-checkpoints:/flink-checkpoints
    depends_on: [jobmanager]

  replay-producer:
    image: scalable/producer-rs
    command: ["replay"]
    environment:
      <<: *iggy-env
      SERVICE: replay-producer
      IGGY_HOST: iggy
      CSV_FILE: ${CSV_FILE:-/data/pala.csv}
      REPEAT: ${REPEAT:-1}
      RATE: ${RATE:-0}
      BATCH_SIZE: ${BATCH_SIZE:-4000}
      IGGY_TCP_NODELAY: ${IGGY_TCP_NODELAY:-true}
    volumes:
      - ${DATA_DIR:-./docs}:/data:ro
    depends_on:
      iggy-setup: { condition: service_completed_successfully }

  # Dashboards (docs/architecture.md §5): Trading trends (FR-19), Correctness & data quality (NFR-7..9),
  # System metrics (NFR-10). Provisioned from config/grafana; Grafana's own port 3000 is taken by Iggy's HTTP API.
  grafana:
    image: grafana/grafana:12.2.1
    ports:
      - "3001:3000"
    environment:
      SERVICE: grafana
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/trading-trends.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      timescaledb: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.7.3
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    environment:
      SERVICE: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # Per-container CPU, memory and network (NFR-10).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true
    environment:
      SERVICE: cadvisor
    devices: [/dev/kmsg]
    # Docker here uses the containerd image store, which cAdvisor's Docker handler cannot read ("failed to
    # identify the read-write layer"), so containers are read through containerd (Docker's namespace `moby`).
    # Compose labels are not visible there; each service sets SERVICE=<name>, exported as `container_env_SERVICE`.
    command: ["--docker=unix:///nonexistent.sock", "--containerd-namespace=moby", "--docker_only=true",
              "--housekeeping_interval=5s", "--store_container_labels=false", "--env_metadata_whitelist=SERVICE",
              "--disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

volumes:
  iggy-data:
  timescale-data:
  flink-checkpoints:
  grafana-data:
  prometheus-data:
