# Minimal Iggy -> Flink connector experiment (see docs/architecture.md).
#
#   docker compose up --build            # iggy, setup, Flink JM + 2 TMs, replay producer
#   docker compose logs -f taskmanager   # per-node counters
#   docker compose run --rm replay-producer   # replay the CSV again
#
# Flink UI: http://localhost:8081

x-iggy-env: &iggy-env
  IGGY_USERNAME: iggy
  IGGY_PASSWORD: iggy
  IGGY_STREAM: trading
  IGGY_TOPIC: ticks
  IGGY_ADVISORIES_TOPIC: advisories     # output: BUY/SELL advisories from the Flink job
  IGGY_CONSUMER_GROUP: ${IGGY_CONSUMER_GROUP:-flink}

x-flink-env: &flink-env
  <<: *iggy-env
  IGGY_ADDRESS: iggy:8090
  IGGY_POLL_BATCH: ${IGGY_POLL_BATCH:-100}
  PIPELINE: ${PIPELINE:-full}          # full | count (source only)
  REPORT_INTERVAL_MS: ${REPORT_INTERVAL_MS:-5000}
  # PIPELINE=jdbc (TimescaleDB sink test)
  JDBC_URL: jdbc:postgresql://timescaledb:5432/trading
  JDBC_USER: postgres
  JDBC_PASSWORD: postgres
  OUT_OF_ORDERNESS_S: ${OUT_OF_ORDERNESS_S:-60}
  IDLENESS_S: ${IDLENESS_S:-10}       # 0 = no idleness
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: jobmanager
    taskmanager.numberOfTaskSlots: 1
    parallelism.default: 2
    execution.checkpointing.interval: ${CHECKPOINT_INTERVAL:-10 s}
    # File-system checkpoints on a volume shared by JobManager and TaskManagers. The default in-memory
    # (JobManager) storage is capped at 5 MB, which growing window state exceeded (MEASUREMENTS.md).
    execution.checkpointing.storage: filesystem
    execution.checkpointing.dir: file:///flink-checkpoints
    restart-strategy.type: fixed-delay
    restart-strategy.fixed-delay.attempts: 10
    restart-strategy.fixed-delay.delay: 5 s

services:
  iggy:
    image: apache/iggy:0.10.0
    cap_add: [SYS_NICE]
    security_opt: [seccomp:unconfined]
    ulimits:
      memlock: { soft: -1, hard: -1 }
    environment:
      IGGY_ROOT_USERNAME: iggy
      IGGY_ROOT_PASSWORD: iggy
      IGGY_NODE_ADVERTISED_ADDRESS: iggy
      # 0.10 defaults to loopback binds, which are unreachable from other containers
      IGGY_TCP_ADDRESS: 0.0.0.0:8090
      IGGY_HTTP_ADDRESS: 0.0.0.0:3000
      IGGY_QUIC_ENABLED: "false"
      IGGY_WEBSOCKET_ENABLED: "false"
      # default NUMA-aware allocation fails inside a container ("only 0 available")
      IGGY_SHARDING_CPU_ALLOCATION: ${IGGY_SHARDS:-2}
      IGGY_SHARDING_PIN_CORES: "false"
    ports:
      - "8090:8090"   # TCP
      - "3000:3000"   # HTTP API
    volumes:
      - iggy-data:/local_data

  timescaledb:
    image: timescale/timescaledb:2.31.0-pg17
    shm_size: 512mb   # Docker's 64 MB /dev/shm is too small for parallel queries ("could not resize shared memory segment")
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./config/timescaledb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading"]
      interval: 2s
      retries: 30

  # Creates stream, input topic `ticks` + consumer group (the Flink connector expects the group to exist)
  # and output topic `advisories`.
  iggy-setup:
    build: ./producer-rs
    image: scalable/producer-rs
    command: ["setup"]
    environment:
      <<: *iggy-env
      IGGY_HOST: iggy
      # 1 partition: the Iggy Flink connector has one watermark per reader, not per partition; with more
      # partitions about half the events arrive late (MEASUREMENTS.md). Only one reader is active anyway.
      IGGY_PARTITIONS: ${IGGY_PARTITIONS:-1}
      # 1 partition: the connector's sink writes round-robin only, so more partitions could reorder a
      # symbol's advisories. Advisories are few (~11k-26k per week).
      IGGY_ADVISORIES_PARTITIONS: ${IGGY_ADVISORIES_PARTITIONS:-1}
    depends_on: [iggy]

  jobmanager:
    build: ./flink-job
    image: scalable/flink-job
    command: standalone-job --job-classname scalable.flink.ConnectorTestJob
    ports:
      - "8081:8081"
    environment: *flink-env
    volumes:
      - flink-checkpoints:/flink-checkpoints
    depends_on:
      iggy-setup: { condition: service_completed_successfully }
      timescaledb: { condition: service_healthy }

  taskmanager:
    image: scalable/flink-job
    command: taskmanager
    deploy:
      replicas: 2
    environment: *flink-env
    volumes:
      - flink-checkpoints:/flink-checkpoints
    depends_on: [jobmanager]

  replay-producer:
    image: scalable/producer-rs
    command: ["replay"]
    environment:
      <<: *iggy-env
      IGGY_HOST: iggy
      CSV_FILE: ${CSV_FILE:-/data/pala.csv}
      REPEAT: ${REPEAT:-1}
      RATE: ${RATE:-0}
      BATCH_SIZE: ${BATCH_SIZE:-4000}
      IGGY_TCP_NODELAY: ${IGGY_TCP_NODELAY:-true}
    volumes:
      - ${DATA_DIR:-./docs}:/data:ro
    depends_on:
      iggy-setup: { condition: service_completed_successfully }

volumes:
  iggy-data:
  timescale-data:
  flink-checkpoints:
