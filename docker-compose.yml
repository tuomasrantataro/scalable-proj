# Kafka -> Flink -> TimescaleDB (see docs/architecture.md).
#
#   docker compose up -d --build         # everything except the producer (see README: Run)
#   docker compose run --rm replay-producer   # send a CSV file (profile `producer`: only runs when called)
#   docker compose logs -f taskmanager   # per-node counters
#
# Flink UI: http://localhost:8081   Grafana: http://localhost:3001 (admin/admin; anonymous viewers allowed)
# Prometheus: http://localhost:9090

# Client settings shared by the setup, the producer and Flink. (Not given to the kafka service: the broker image
# reads every KAFKA_* variable as broker configuration.)
x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP: kafka:9092
  KAFKA_TOPIC: ${KAFKA_TOPIC:-ticks}
  KAFKA_ADVISORIES_TOPIC: advisories     # output: BUY/SELL advisories from the Flink job

x-flink-env: &flink-env
  <<: *kafka-env
  KAFKA_GROUP: ${KAFKA_GROUP:-flink}
  KAFKA_MAX_POLL_RECORDS: ${KAFKA_MAX_POLL_RECORDS:-5000}
  REPORT_INTERVAL_MS: ${REPORT_INTERVAL_MS:-5000}
  JDBC_URL: ${JDBC_URL:-jdbc:postgresql://timescaledb:5432/trading?reWriteBatchedInserts=true}   # multi-row upserts (MEASUREMENTS.md §12)
  JDBC_USER: postgres
  JDBC_PASSWORD: postgres
  EMA_SINK: ${EMA_SINK:-jdbc}         # discard = no ema_window rows, only to measure what the database costs (bench/db_limit.py)
  JDBC_BATCH_SIZE: ${JDBC_BATCH_SIZE:-1000}         # rows per upsert batch of the TimescaleDB sinks
  OUT_OF_ORDERNESS_S: ${OUT_OF_ORDERNESS_S:-1}   # may be fractional (architecture §3.4)
  IDLENESS_S: ${IDLENESS_S:-10}       # 0 = no idleness
  # Pause a partition that is this far (event time) ahead of the slowest one; 0 = off (TradingJob)
  WATERMARK_ALIGNMENT_S: ${WATERMARK_ALIGNMENT_S:-300}
  # Data-quality report thresholds
  SKEW_REPORT_S: ${SKEW_REPORT_S:-3600}             # Trading time vs system Time
  PRICE_JUMP_REPORT: ${PRICE_JUMP_REPORT:-0.10}     # close vs previous close of the symbol
  # Per-trader advisory subscriptions (FR-4), read by the job at start (JobManager). Format: config/subscriptions.txt
  SUBSCRIPTIONS_FILE: ${SUBSCRIPTIONS_FILE:-/config/subscriptions.txt}
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: jobmanager
    taskmanager.numberOfTaskSlots: ${TASK_SLOTS:-1}
    # PARALLELISM: the source can use up to the partition count of `ticks` (8)
    parallelism.default: ${PARALLELISM:-4}
    # Heap (HashMap) state backend: keyed state lives as Java objects on the TaskManager heap. State is
    # small (per symbol: EMAs plus the open window), so RocksDB's disk spill and serialization are not needed.
    state.backend.type: hashmap
    execution.checkpointing.interval: ${CHECKPOINT_INTERVAL:-10 s}
    # File-system checkpoints on a volume shared by JobManager and TaskManagers. The default in-memory
    # (JobManager) storage is capped at 5 MB, which growing window state exceeded (MEASUREMENTS.md).
    execution.checkpointing.storage: filesystem
    execution.checkpointing.dir: file:///flink-checkpoints
    restart-strategy.type: fixed-delay
    restart-strategy.fixed-delay.attempts: 10
    restart-strategy.fixed-delay.delay: 5 s
    # Prometheus endpoint on every JobManager / TaskManager (scraped by `prometheus`, shown in Grafana)
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: 9249

services:
  # Single Kafka broker in KRaft mode (broker and controller in one process, no ZooKeeper).
  kafka:
    image: apache/kafka:4.3.2
    environment:
      SERVICE: kafka   # container label for cAdvisor (see the cadvisor service)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT for the containers, EXTERNAL (localhost:9094) for tools on the host
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # one broker: internal topics cannot be replicated
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics come from kafka-setup, with their partition counts
      KAFKA_HEAP_OPTS: -Xms1g -Xmx1g
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 20s
      retries: 30

  timescaledb:
    image: timescale/timescaledb:2.31.0-pg17
    shm_size: 512mb   # Docker's 64 MB /dev/shm is too small for parallel queries ("could not resize shared memory segment")
    environment:
      SERVICE: timescaledb
      POSTGRES_DB: trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./config/timescaledb:/docker-entrypoint-initdb.d:ro   # fresh volume (also for --no-deps bench runs)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading"]
      interval: 2s
      retries: 30

  # One-shot: applies the idempotent schema, so new tables also reach an existing database volume.
  db-setup:
    image: timescale/timescaledb:2.31.0-pg17
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-h", "timescaledb", "-U", "postgres", "-d", "trading",
              "-f", "/init/init.sql"]
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./config/timescaledb:/init:ro
    depends_on:
      timescaledb: { condition: service_healthy }

  # One-shot: creates the input topic `ticks` and the output topic `advisories` (existing topics are kept).
  kafka-setup:
    build: ./producer-rs
    image: scalable/producer-rs
    command: ["setup"]
    environment:
      <<: *kafka-env
      # Partitions of `ticks` = the upper bound on source parallelism. Each partition has its own watermark in
      # the Flink Kafka source, so any count gives the same results (MEASUREMENTS.md).
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-8}
      # Kept until deleted (-1), so a loaded backlog can be replayed into the job any number of times
      # (bench/backlog.py). Kafka's default would delete it 7 days after loading.
      KAFKA_RETENTION_MS: ${KAFKA_RETENTION_MS:--1}
      # Advisories are keyed by symbol, so a symbol's advisories stay in order within one partition.
      KAFKA_ADVISORIES_PARTITIONS: ${KAFKA_ADVISORIES_PARTITIONS:-4}
    depends_on:
      kafka: { condition: service_healthy }

  jobmanager:
    build: ./flink-job
    image: scalable/flink-job
    command: standalone-job --job-classname scalable.flink.TradingJob
    ports:
      - "8081:8081"
    environment:
      <<: *flink-env
      SERVICE: jobmanager
    volumes:
      - flink-checkpoints:/flink-checkpoints
      - ./config:/config:ro    # subscriptions.txt
    depends_on:
      kafka-setup: { condition: service_completed_successfully }
      db-setup: { condition: service_completed_successfully }

  taskmanager:
    image: scalable/flink-job
    command: taskmanager
    deploy:
      replicas: ${TASKMANAGERS:-4}   # TASKMANAGERS x TASK_SLOTS must be at least PARALLELISM
    environment:
      <<: *flink-env
      SERVICE: taskmanager
    volumes:
      - flink-checkpoints:/flink-checkpoints
    depends_on: [jobmanager]

  # Not started by `docker compose up` (profile), so it never adds the sample file to a loaded backlog.
  # Run it explicitly: `docker compose run --rm replay-producer`.
  replay-producer:
    image: scalable/producer-rs
    profiles: [producer]
    command: ["replay"]
    environment:
      <<: *kafka-env
      SERVICE: replay-producer
      CSV_FILE: ${CSV_FILE:-/data/pala.csv}
      REPEAT: ${REPEAT:-1}
      RATE: ${RATE:-0}
      # Pace by the feed's own clock (producer-rs/src/feed.rs): 1 = real time, 10 = ten times faster; 0 = off (RATE applies)
      SPEEDUP: ${SPEEDUP:-0}
      # Only what the feed delivered in [START_TIME, END_TIME), HH:MM; empty = all
      START_TIME: ${START_TIME:-}
      END_TIME: ${END_TIME:-}
      # > 0: replace the symbols by this many equally frequent ones (bench/backlog.py --workload uniform)
      UNIFORM_SYMBOLS: ${UNIFORM_SYMBOLS:-0}
      KAFKA_COMPRESSION: ${KAFKA_COMPRESSION:-lz4}   # CSV rows compress about 4x
      KAFKA_LINGER_MS: ${KAFKA_LINGER_MS:-20}
      # Sender threads. librdkafka reads the clock for every record, a system call on this laptop (HPET clock
      # source), so one thread sends only ~250k records/s (MEASUREMENTS.md).
      PRODUCER_THREADS: ${PRODUCER_THREADS:-8}
    volumes:
      - ${DATA_DIR:-./docs}:/data:ro
    depends_on:
      kafka-setup: { condition: service_completed_successfully }

  # Stands in for a trader's system: reads topic `advisories` and prints each message with its receive time.
  # Started and evaluated by bench/advisory_latency.py (used by bench/backlog.py run and scripts/run-live.sh).
  advisory-latency:
    image: scalable/producer-rs
    profiles: [latency]
    command: ["latency"]
    environment:
      <<: *kafka-env
      SERVICE: advisory-latency
      # messages = one line per message; summary = aggregate in the consumer, one line when idle (many subscribers)
      LATENCY_OUTPUT: ${LATENCY_OUTPUT:-messages}
    depends_on:
      kafka-setup: { condition: service_completed_successfully }

  # Dashboards (docs/architecture.md §5): Trading trends (FR-19), Correctness & data quality (NFR-7..9),
  # System metrics (NFR-10). Provisioned from config/grafana; published on 3001 (3000 was Iggy's HTTP API).
  grafana:
    image: grafana/grafana:12.2.1
    ports:
      - "3001:3000"
    environment:
      SERVICE: grafana
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/trading-trends.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      timescaledb: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.7.3
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    environment:
      SERVICE: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # Per-container CPU, memory and network (NFR-10).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true
    environment:
      SERVICE: cadvisor
    devices: [/dev/kmsg]
    # Docker here uses the containerd image store, which cAdvisor's Docker handler cannot read ("failed to
    # identify the read-write layer"), so containers are read through containerd (Docker's namespace `moby`).
    # Compose labels are not visible there; each service sets SERVICE=<name>, exported as `container_env_SERVICE`.
    command: ["--docker=unix:///nonexistent.sock", "--containerd-namespace=moby", "--docker_only=true",
              "--housekeeping_interval=5s", "--store_container_labels=false", "--env_metadata_whitelist=SERVICE",
              "--disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

volumes:
  kafka-data:
  timescale-data:
  flink-checkpoints:
  grafana-data:
  prometheus-data:
