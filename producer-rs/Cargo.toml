[package]
name = "replay-producer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Replay producer and Kafka topic setup"
publish = false

[dependencies]
# librdkafka, built from source and linked statically (needs cmake and a C compiler at build time).
# No zlib/SSL: the producer uses lz4 and plaintext.
rdkafka = { version = "0.39", default-features = false, features = ["cmake-build"] }
futures = { version = "0.3", default-features = false, features = ["executor"] }

[profile.release]
lto = "thin"
codegen-units = 1
