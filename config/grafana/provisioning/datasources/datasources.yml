apiVersion: 1
datasources:
  - name: TimescaleDB
    uid: timescaledb
    type: grafana-postgresql-datasource
    url: timescaledb:5432
    user: postgres
    isDefault: true
    secureJsonData:
      password: postgres
    jsonData:
      database: trading
      sslmode: disable
      postgresVersion: 1700
      timescaledb: true
      maxOpenConns: 10
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    jsonData:
      timeInterval: 5s
